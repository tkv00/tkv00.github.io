        <title id="server-exploded-title">서버 한 대에 올라간 것</title>
        <desc id="server-exploded-desc">Oracle A1 서버 한 대를 세 층으로 분해한 그림: 바닥은 SSH만 열린 VM, 가운데는 녹음과 녹취가 7일 남는 볼륨 두 개, 위는 녹음 봇과 n8n 컨테이너다.</desc>
