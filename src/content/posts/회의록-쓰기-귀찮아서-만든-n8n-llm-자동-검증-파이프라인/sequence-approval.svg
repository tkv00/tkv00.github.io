      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #sequence-approval-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sequence-approval-root .diagram-container { width: 100%; overflow-x: auto; }
      #sequence-approval-root .diagram-container { overflow-x: visible; }</style>
