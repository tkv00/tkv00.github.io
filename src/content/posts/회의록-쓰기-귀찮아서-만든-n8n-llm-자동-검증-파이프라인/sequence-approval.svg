<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 716" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequence-approval-title sequence-approval-desc" id="sequence-approval-root">
        <title id="sequence-approval-title">승인 버튼이 n8n을 재개하는 순서</title>
        <desc id="sequence-approval-desc">회의 채널의 승인이나 수정 클릭을 녹음 봇이 받아 n8n 재개 주소로 전달하고, n8n이 판 번호를 비교한 뒤 승인이면 ClickUp에 페이지를 만들어 다시 읽어 대조하고, 검증을 통과한 수정이면 같은 메시지를 고쳐 다시 기다리는 순서.</desc>
