# ─────────────────────────────────────────────────────────────
# 깃돌 글쓰기 화면 설정
#
# 저장을 누르면 tkv00/tkv00.github.io 저장소에 그대로 커밋된다.
# 그래서 이 저장소에 쓰기 권한이 없는 사람은 아무것도 저장할 수 없다 —
# 화면이 막는 게 아니라 GitHub이 막는다.
# ─────────────────────────────────────────────────────────────

backend:
  name: github
  repo: tkv00/tkv00.github.io
  branch: main
  commit_messages:
    create: '글 추가: {{slug}}'
    update: '글 수정: {{slug}}'
    delete: '글 삭제: {{slug}}'
    uploadMedia: '이미지 추가: {{path}}'
    deleteMedia: '이미지 삭제: {{path}}'

locale: ko
site_url: https://tkv00.github.io
display_url: https://tkv00.github.io
logo_url: /favicon.svg

publish_mode: simple

# 컬렉션 밖에서 올린 이미지가 떨어지는 곳 (거의 쓸 일 없다)
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: posts
    label: 글
    label_singular: 글
    description: 글 하나가 폴더 하나다. 이미지를 끌어다 놓으면 그 폴더 안에 같이 저장된다.
    folder: src/content/posts
    # posts/<슬러그>/index.md 로 저장한다
    path: '{{slug}}/index'
    # 빈 값 = 글과 같은 폴더. 이미지 경로를 손으로 맞출 일이 없어지는 지점.
    media_folder: ''
    public_folder: ''
    create: true
    slug: '{{slug}}'
    preview_path: 'posts/{{slug}}'
    editor:
      preview: true
    sortable_fields: [date, title]
    view_groups:
      - label: 프로젝트
        field: project
    fields:
      - label: 제목
        name: title
        widget: string

      - label: 한 줄 소개
        name: description
        widget: text
        required: false
        hint: 검색 결과와 공유 카드에 뜨는 문장입니다. 비워두면 본문 첫 문단에서 잘라 씁니다.

      - label: 작성일
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        picker_utc: false

      - label: 프로젝트
        name: project
        widget: select
        required: false
        options: [Holliverse, Shoot-Pointer, WealthTracker, Vero, Qampus, TR1L]
        hint: 사이드바 '프로젝트'에 묶입니다. 프로젝트 글이 아니면 비워두세요.

      - label: 카테고리
        name: category
        widget: select
        required: false
        options: [데이터베이스, 자바, 스프링, 유레카, 회고, 메모]
        hint: 사이드바 '카테고리'에 묶입니다.

      - label: 태그
        name: tags
        widget: list
        required: false
        default: []
        hint: 쉼표가 아니라 항목으로 하나씩 넣습니다.

      - label: 대표 이미지
        name: cover
        widget: image
        required: false
        hint: 비워두면 공유 카드 이미지를 제목으로 자동 생성합니다.

      - label: 임시 저장
        name: draft
        widget: boolean
        default: false
        hint: 켜두면 내 컴퓨터에서만 보이고 블로그에는 올라가지 않습니다.

      - label: 본문
        name: body
        widget: markdown
        hint: 이미지는 편집기 안으로 끌어다 놓으면 됩니다. 경로는 알아서 채워집니다.
